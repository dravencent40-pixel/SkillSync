[phases.setup]
nixPkgs = ["php82", "nodejs_20", "php82Packages.composer"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader", "npm install"]

[phases.build]
cmds = ["npm run build", "php artisan config:cache", "php artisan route:cache"]

[start]
cmd = "php artisan serve --host 0.0.0.0 --port $PORT"